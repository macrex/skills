<!doctype html>
<!-- A tela da grill-tela: o servidor (grill-tela.js) a serve com o token na URL; ela consulta
     /api/estado a cada segundo e desenha a fase atual (rodada, aguarde, final, concluido, cli).
     A rodada tem dois modos: Panorama, uma tabela com todas as questões numa tela só, e Uma por
     vez, com as descrições de cada opção e as teclas 1–9. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grill</title>
<link rel="icon" href="data:,"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F6F3; --surface:#FFFFFF; --surface2:#FAFAF8; --line:#E2E2DC; --line2:#EDEDE8; --ink:#1A1C20; --muted:#5E636B;
  --rec:#1D6B4F; --rec-ink:#FFFFFF; --rec-soft:#E6F1EC; --sel:#1A1C20; --sel-ink:#FFFFFF; --pill-line:#DADAD3; --pill-ink:#3A3E45;
  --troca:#9A5B00; --troca-soft:#FFFBF3; --nota:#7A4A00; --nota-soft:#FBF1E1; --nota-line:#F0D9B0; --shadow:0 1px 2px rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121315; --surface:#1A1B1E; --surface2:#202125; --line:#2D2F34; --line2:#26282C; --ink:#E8E8E3; --muted:#9DA1A8;
    --rec:#3FA57A; --rec-ink:#0C1A13; --rec-soft:#183126; --sel:#E8E8E3; --sel-ink:#121315; --pill-line:#3A3C42; --pill-ink:#C9CCD1;
    --troca:#E3A64A; --troca-soft:#211B11; --nota:#E8B868; --nota-soft:#2B2213; --nota-line:#4A3A1E; --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#121315; --surface:#1A1B1E; --surface2:#202125; --line:#2D2F34; --line2:#26282C; --ink:#E8E8E3; --muted:#9DA1A8;
  --rec:#3FA57A; --rec-ink:#0C1A13; --rec-soft:#183126; --sel:#E8E8E3; --sel-ink:#121315; --pill-line:#3A3C42; --pill-ink:#C9CCD1;
  --troca:#E3A64A; --troca-soft:#211B11; --nota:#E8B868; --nota-soft:#2B2213; --nota-line:#4A3A1E; --shadow:0 1px 2px rgba(0,0,0,.4);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "IBM Plex Sans",ui-sans-serif,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--pill-line);border-radius:8px;padding:0 12px;width:100%}
input{min-height:40px}textarea{padding:10px 12px}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--rec);outline-offset:1px}
code{font:12.5px "IBM Plex Mono",ui-monospace,monospace;background:var(--surface2);border:1px solid var(--line2);padding:0 5px;border-radius:5px}
a{color:var(--rec)}
.pill code,.opt code,.lado code{background:none;border:none;padding:0;color:inherit;font-size:.95em}
strong{font-weight:600}
.mono{font-family:"IBM Plex Mono",ui-monospace,monospace}
.muted{color:var(--muted)}

/* topo */
.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1320px;margin:0 auto;padding:6px 32px;min-height:56px;display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap}
.marca{font:500 16px "IBM Plex Mono",ui-monospace,monospace}
.passos{display:flex;align-items:center;gap:10px;list-style:none;margin:0;padding:0;font-size:13px;color:var(--muted)}
.passos .feito{color:var(--rec)}.passos .agora{color:var(--ink);font-weight:600}
.passos .traco{width:16px;height:1px;background:var(--line)}
.acoes{margin-left:auto;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;padding:2px;background:var(--bg);margin-right:6px}
.seg button{border:none;border-radius:6px;background:none;color:var(--muted);font-size:13px;padding:0 12px;min-height:34px}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:var(--shadow)}
.ico{width:40px;height:40px;border-radius:8px;border:1px solid transparent;background:none;color:var(--muted);display:inline-grid;place-items:center;padding:0;flex:none}
.ico:hover{color:var(--ink);background:var(--surface2)}
.ico.tem{background:var(--nota-soft);border-color:var(--nota-line);color:var(--nota)}
.ico.falando{color:var(--rec-ink);background:var(--rec);animation:pu 1.2s ease-in-out infinite}
.sublink{border:none;background:none;color:var(--muted);font-size:13px;min-height:40px;padding:0 8px;text-decoration:underline;text-underline-offset:3px}
.sublink:hover{color:var(--ink)}

.wrap{max-width:1320px;margin:0 auto;padding:28px 32px 40px}
.cabeca{display:flex;align-items:flex-end;justify-content:space-between;gap:16px 24px;flex-wrap:wrap;margin-bottom:20px}
.h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.02em}
.sub{margin:4px 0 0;color:var(--muted)}
.envio{display:flex;align-items:center;gap:8px 16px;flex-wrap:wrap}
.resumo{font:12.5px "IBM Plex Mono",ui-monospace,monospace;color:var(--muted)}
.btn{border:1px solid transparent;border-radius:8px;font-weight:600;padding:0 20px;min-height:44px}
.btn.pri{background:var(--sel);color:var(--sel-ink)}.btn.pri:disabled{opacity:.35}
.btn.ok{background:var(--rec);color:var(--rec-ink)}
.btn.sec{background:var(--surface);border-color:var(--pill-line);font-weight:500}
.erro{color:var(--troca);font-size:13px}
.caixa{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.nota-rodape{margin:14px 0 0;font-size:12.5px;color:var(--muted)}

/* panorama: uma linha por questão */
.cols,.lin{display:flex;flex-wrap:wrap;gap:10px 24px}
.cols{padding:10px 20px;background:var(--surface2);border-bottom:1px solid var(--line);font:11px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lin{position:relative;align-items:flex-start;padding:14px 20px;border-top:1px solid var(--line2)}
.lin:first-of-type{border-top:none}
.lin.troca{background:var(--troca-soft)}
.c-tema{flex:0 0 150px}.c-perg{flex:1 1 320px;min-width:0}.c-resp{flex:1.35 1 400px;min-width:0}.c-nota{flex:0 0 84px;display:flex;gap:4px;justify-content:flex-end}
.qid{font:12px "IBM Plex Mono",ui-monospace,monospace;color:var(--muted)}
.cab{font-weight:600}
.st{margin-top:2px;font-size:12px;font-weight:500;color:var(--muted)}
.st .aceito{color:var(--rec)}.st .outra{color:var(--troca)}.st .com{color:var(--nota)}
.tit{font-size:15px;font-weight:500}
.ctx{margin-top:2px;font-size:13px;color:var(--muted)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:999px;font-size:13px;background:var(--surface);color:var(--pill-ink);border:1px solid var(--pill-line);text-align:left}
.pill:hover{border-color:var(--muted)}
.pill.rec{color:var(--rec);border:1px dashed var(--rec)}
.pill.sel{background:var(--sel);color:var(--sel-ink);border:1px solid var(--sel);font-weight:600}
.pill.sel.rec{background:var(--rec);color:var(--rec-ink);border-color:var(--rec)}
.pill.outra-p{color:var(--muted);border-style:dashed}
.pill.outra-p.sel{color:var(--sel-ink)}
.desc{margin-top:6px;font-size:12.5px;color:var(--muted)}
.campo{margin-top:8px}
.campo.nota{border-color:var(--nota-line);background:var(--nota-soft)}

/* uma por vez */
.foco{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.lado{flex:1 1 220px;max-width:280px;padding:6px}
.lado button{display:flex;gap:10px;align-items:center;width:100%;text-align:left;border:none;background:none;border-radius:8px;padding:8px 10px;min-height:48px}
.lado button.on{background:var(--surface2)}
.lado .bola{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;flex:none;background:var(--line2);color:var(--muted)}
.lado .bola.aceito{background:var(--rec);color:var(--rec-ink)}.lado .bola.outra{background:var(--troca);color:var(--surface)}
.lado small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.cartao{flex:999 1 560px;min-width:0;padding:26px 28px}
.cartao h2{margin:10px 0 4px;font-size:22px;font-weight:600;letter-spacing:-.01em}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border-radius:10px;background:var(--surface);border:1px solid var(--pill-line)}
.opt:hover{border-color:var(--muted)}
.opt .lab{font-weight:600}
.opt .d{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.opt.rec{border-style:dashed;border-color:var(--rec)}
.opt.sel{background:var(--surface2);border:1.5px solid var(--sel)}
.opt.sel.rec{border:1.5px solid var(--rec);background:var(--rec-soft)}
.kbd{font:11px "IBM Plex Mono",ui-monospace,monospace;border:1px solid var(--pill-line);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted);flex:none;margin-top:2px}
.estrela{display:inline-flex;align-items:center;gap:3px;font-size:11.5px;font-weight:500;color:var(--rec);margin-left:6px}
.rotulo{display:block;margin:16px 0 0;font-size:12.5px;font-weight:500;color:var(--muted)}
.navega{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px}

/* histórico */
.hist{margin-top:16px}
.hist summary{cursor:pointer;padding:12px 20px;font-weight:500;color:var(--muted);min-height:44px;display:flex;align-items:center}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:11px 20px;border-top:1px solid var(--line2);vertical-align:top}
th{font:11px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;background:var(--surface2);border-top:1px solid var(--line)}

/* aguarde, final e fim */
.centro{min-height:60vh;display:grid;place-items:center;text-align:center}
.centro .h1{font-size:22px}
.spin{width:28px;height:28px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--rec);animation:sp .9s linear infinite;margin:0 auto 18px}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes pu{50%{opacity:.5}}
.glifo{font:500 34px "IBM Plex Mono",ui-monospace,monospace;color:var(--rec);margin-bottom:10px}
details.recebido{margin-top:18px;text-align:left}details.recebido summary{cursor:pointer;color:var(--muted);font-size:13px}
pre{background:var(--surface2);border:1px solid var(--line2);border-radius:8px;padding:12px;font-size:12px;overflow:auto;max-height:260px;text-align:left}
.final{max-width:1040px;margin:0 auto}

.cfg{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);box-shadow:0 8px 28px rgba(0,0,0,.12);padding:16px;width:260px;margin:0;inset:auto;position:fixed;top:64px;right:max(16px,calc((100vw - 1320px)/2 + 32px))}
.cfg h4{margin:0 0 12px;font:11px "IBM Plex Mono",ui-monospace,monospace;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cfg label{display:flex;justify-content:space-between;font-size:13px;font-weight:500}
.cfg input[type=range]{padding:0;border:none;min-height:0;accent-color:var(--rec);margin:8px 0 12px}
.cfg select{width:100%;font:inherit;font-size:13px;color:var(--ink);background:var(--surface);border:1px solid var(--pill-line);border-radius:8px;padding:8px 10px;margin:8px 0 12px}

@media (max-width:760px){
  .top-in,.wrap{padding-left:16px;padding-right:16px}
  .cols{display:none}
  .c-tema{flex-basis:100%;display:flex;gap:8px;align-items:baseline}
  .c-tema{padding-right:92px}
  .c-nota{position:absolute;top:6px;right:12px}
  .lado{max-width:none}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
const TOKEN = new URLSearchParams(location.search).get('t');
// E: o estado do servidor; S: o que só a página sabe (marcas ainda não enviadas, campos abertos)
let E = null;
const S = { resp:{}, foco:0, abreAjuste:false, ajuste:'', erro:'', enviando:false, caiu:false };
// modo e tema ficam no JSON de preferências do servidor, porque a porta muda a cada grill
const VAR = {A:'Panorama', B:'Uma por vez'};
let V = 'A';

async function api(rota, metodo='GET', corpo){
  const r = await fetch(`/api/${rota}?t=${TOKEN}`, { method:metodo, headers:{'content-type':'application/json'},
    body: corpo===undefined ? undefined : JSON.stringify(corpo) });
  const json = await r.json().catch(()=>null);
  return { ok:r.ok, json };
}

// ---------- texto do agente: escapa tudo, depois o markdown curto ----------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function md(s){
  const partes = esc(s).split(/(`[^`]+`)/);   // código não recebe as outras marcas
  return partes.map(p => p.startsWith('`') && p.endsWith('`') && p.length>1 ? `<code>${p.slice(1,-1)}</code>` :
    p.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
     .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
     .replace(/(^|[^\w*])\*([^*\s][^*]*)\*/g, '$1<em>$2</em>')
     .replace(/(^|[^\w])_([^_\s][^_]*)_/g, '$1<em>$2</em>')).join('');
}

function modo(v){ V=v; S.foco=0; api('preferencias','POST',{modo:v}); render(); }
const escuro = () => (document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))==='dark';
function tema(){ const t = escuro()?'light':'dark'; document.documentElement.dataset.theme=t; api('preferencias','POST',{tema:t}); render(); }

// ---------- ícones: traço fino, cor do texto ----------
const svg = (d, t=18) => `<svg width="${t}" height="${t}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${d}</svg>`;
const ICONE_SOM = svg('<path d="M11 5 6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/>', 17);
const ICONE_NOTA = svg('<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>', 17);
const ICONE_LUA = svg('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>');
const ICONE_SOL = svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>');
const ESTRELA = '<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.6 6.6 19.5l1.2-6-4.5-4.2 6.1-.7z"/></svg>';

// ---------- leitura em voz alta: speechSynthesis nativo; o estado vive aqui, fora do DOM, e sobrevive ao render() ----------
const TEM_VOZ = 'speechSynthesis' in window;
const LEIT = { voz:null, vel:1, vol:0.8, falando:null };
const vozes = () => (TEM_VOZ ? speechSynthesis.getVoices() : [])
  .slice().sort((a,b)=> (b.lang.startsWith('pt')-a.lang.startsWith('pt')) || a.name.localeCompare(b.name));
const vozAtual = () => { const vs=vozes(); return vs.find(v=>v.name===LEIT.voz) || vs.find(v=>v.lang.replace('_','-').startsWith('pt-BR')) || vs[0]; };
const opcoesVoz = () => { const a=vozAtual(); return vozes().map(v=>`<option value="${esc(v.name)}" ${v===a?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('') || '<option>Carregando vozes…</option>'; };
if(TEM_VOZ) speechSynthesis.onvoiceschanged = () => { const el=document.getElementById('voz'); if(el) el.innerHTML=opcoesVoz(); };
const puro = s => String(s ?? '').replace(/\[([^\]]+)\]\([^)]*\)/g,'$1').replace(/[`*]/g,'').replace(/(^|\W)_([^_\s][^_]*)_/g,'$1$2').trim();
const frase = s => { const t=puro(s); return !t || /[.?!:]$/.test(t) ? t : t+'.'; };
const textoDa = q => [q.id, q.titulo, q.contexto, ...q.opcoes.map((o,i)=>`Opção ${i+1}${o.recomendada?', recomendada':''}: ${frase(o.rotulo)} ${frase(o.descricao)}`)]
  .map(frase).filter(Boolean).join(' ');
function marcaFala(id){ LEIT.falando=id; document.querySelectorAll('[data-fala]').forEach(b=>b.classList.toggle('falando', b.dataset.fala===id)); }
function parar(){ if(TEM_VOZ) speechSynthesis.cancel(); marcaFala(null); }
function falarTexto(id, texto){
  if(!TEM_VOZ) return;
  const era = LEIT.falando; parar();
  if(era===id) return;                       // clicar de novo no mesmo ícone para
  const u = new SpeechSynthesisUtterance(texto); u.lang='pt-BR'; u.volume=LEIT.vol; u.rate=LEIT.vel;
  const voz = vozAtual(); if(voz){ u.voice=voz; u.lang=voz.lang; }
  u.onend = u.onerror = () => { if(LEIT.falando===id) marcaFala(null); };
  speechSynthesis.speak(u); marcaFala(id);
}
const falar = i => falarTexto(Q()[i].id, textoDa(Q()[i]));
const somBtn = i => TEM_VOZ ? `<button class="ico ${LEIT.falando===Q()[i].id?'falando':''}" data-fala="${esc(Q()[i].id)}" aria-label="Ouvir esta questão" title="Ouvir esta questão" onclick="falar(${i})">${ICONE_SOM}</button>` : '';
const fmtVel = v => (+v).toFixed(2).replace(/0$/,'')+'×';
function ajusteVoz(k,v){ LEIT[{voz:'voz',velocidade:'vel',volume:'vol'}[k]] = k==='voz' ? v : +v; api('preferencias','POST',{[k]: k==='voz' ? v : +v}); }
function painelVoz(){
  return `<div id="cfg-leitura" class="cfg" popover><h4>Leitura em voz alta</h4>
   <label for="voz">Voz</label><select id="voz" onchange="ajusteVoz('voz',this.value)">${opcoesVoz()}</select>
   <label>Velocidade <span id="vel-v">${fmtVel(LEIT.vel)}</span></label>
   <input type="range" aria-label="Velocidade" min="0.5" max="2" step="0.25" value="${LEIT.vel}" oninput="document.getElementById('vel-v').textContent=fmtVel(this.value)" onchange="ajusteVoz('velocidade',this.value)">
   <label>Volume <span id="vol-v">${Math.round(LEIT.vol*100)}%</span></label>
   <input type="range" aria-label="Volume" min="0" max="1" step="0.05" value="${LEIT.vol}" oninput="document.getElementById('vol-v').textContent=Math.round(this.value*100)+'%'" onchange="ajusteVoz('volume',this.value)">
   <button class="btn sec" style="width:100%" onclick="falarTexto('teste','Assim fica a leitura com esta voz, esta velocidade e este volume.')">Testar</button>
   ${TEM_VOZ?'':'<p class="sub" style="margin:10px 0 0">Este navegador não tem leitura em voz.</p>'}</div>`;
}

// ---------- rodada ----------
const R = () => E.rodada;
const Q = () => R().questoes;
// toda questão nasce com a recomendada marcada, para a rodada poder ir direto no Enviar
const resp = q => S.resp[`${R().rodada}:${q.id}`] ||= { opcao:recIdx(q), propria:'', com:'', abreProp:false, abreCom:false };
const recIdx = q => q.opcoes.findIndex(o=>o.recomendada);
const marca = q => { const a=resp(q); return a.opcao!==null ? (a.opcao===recIdx(q)?'aceito':'outra') : (a.propria.trim()?'outra':null); };
const nProntas = () => Q().filter(marca).length;
const qi = i => Q()[i];

function escolher(i,o){ const a=resp(qi(i)); a.opcao=o; a.propria=''; a.abreProp=false; render(); }
function propria(i,txt){ const a=resp(qi(i)); a.propria=txt; if(txt.trim()) a.opcao=null; else if(a.opcao===null) a.opcao=recIdx(qi(i)); atualiza(i); }
function comentar(i,txt){ resp(qi(i)).com=txt; atualiza(i); }
// abre o campo e já põe o cursor nele
function abrir(i, campo){ resp(qi(i))[campo]=true; render(); const el=document.querySelector(`[data-campo="${campo}-${i}"]`); if(el) el.focus(); }

async function enviar(){
  if(S.enviando || nProntas()<Q().length) return;
  S.enviando=true; parar();
  const respostas = Q().map(q=>{ const a=resp(q); return { id:q.id, opcao:a.opcao, propria:a.propria, comentario:a.com }; });
  const r = await api('respostas','POST',{ tipo:'rodada', rodada:R().rodada, respostas });
  S.enviando=false; S.erro = r.ok ? '' : (r.json && r.json.erro || 'o servidor recusou o envio');
  await consultar(true);
}

function statusHTML(q){
  const m=marca(q), com=resp(q).com.trim();
  return (m==='aceito' ? '<span class="aceito">aceita</span>' : m==='outra' ? '<span class="outra">trocada</span>' : 'sem resposta')
    + (com ? ' · <span class="com">com nota</span>' : '');
}
function resumoTexto(){
  const ms=Q().map(marca), n=k=>ms.filter(m=>m===k).length, c=Q().filter(q=>resp(q).com.trim()).length;
  const pl=(k,um,v)=>`${k} ${k===1?um:v}`;
  return [pl(n('aceito'),'aceita','aceitas'), pl(n('outra'),'trocada','trocadas'), `${c} com nota`].join(' · ');
}
function descHTML(q){
  const a=resp(q);
  if(a.opcao!==null) return md(q.opcoes[a.opcao].descricao||'');
  return a.propria.trim() ? 'A sua resposta vai como está.' : 'Escreva a sua resposta, ou escolha uma opção.';
}
function pills(q,i){
  const a=resp(q);
  return q.opcoes.map((o,j)=>`<button class="pill ${o.recomendada?'rec':''} ${a.opcao===j?'sel':''}" data-q="${i}" data-o="${j}" aria-pressed="${a.opcao===j}"
      title="${esc(puro(o.descricao))}" onclick="escolher(${i},${j})">${o.recomendada?ESTRELA:''}${md(o.rotulo)}</button>`).join('')
    + `<button class="pill outra-p ${a.opcao===null?'sel':''}" data-q="${i}" data-o="outra" aria-pressed="${a.opcao===null}" onclick="abrir(${i},'abreProp')">Outra…</button>`;
}
const campoProp = (q,i) => { const a=resp(q); return a.abreProp||a.propria
  ? `<input class="campo" data-campo="abreProp-${i}" aria-label="Sua resposta para ${esc(q.id)}" placeholder="Sua resposta…" value="${esc(a.propria)}" oninput="propria(${i},this.value)">` : ''; };
const campoCom = (q,i) => { const a=resp(q); return a.abreCom||a.com
  ? `<input class="campo nota" data-campo="abreCom-${i}" aria-label="Nota sobre ${esc(q.id)}" placeholder="Nota para o agente…" value="${esc(a.com)}" oninput="comentar(${i},this.value)">` : ''; };

function cabecaRodada(sub){
  const t=Q().length, n=nProntas();
  return `<div class="cabeca"><div><h1 class="h1">Rodada ${R().rodada}</h1><p class="sub">${sub}</p></div>
    <div class="envio">${S.erro?`<span class="erro">${esc(S.erro)}</span>`:''}<span class="resumo" id="resumo">${resumoTexto()}</span>
    <button class="btn pri" id="enviar" ${n<t?'disabled':''} onclick="enviar()">Enviar rodada ${R().rodada}</button></div></div>`;
}
function historico(){
  if(!E.historico.length) return '';
  const linhas = E.historico.flatMap(h=>h.respostas.map(r=>({...r, rodada:h.rodada.rodada})));
  return `<details class="caixa hist"><summary>Rodadas anteriores (${E.historico.length})</summary>
    <table><tr><th>Rodada</th><th>Questão</th><th>Resposta</th><th>Marca</th></tr>
    ${linhas.map(r=>`<tr><td class="mono">${r.rodada}</td><td class="mono">${esc(r.id)}</td><td>${md(r.escolha)}${r.comentario?`<div class="muted" style="font-size:12.5px;font-style:italic">“${esc(r.comentario)}”</div>`:''}</td><td class="st"><span class="${r.marca}">${r.marca==='aceito'?'aceita':'trocada'}</span></td></tr>`).join('')}
    </table></details>`;
}
function modoPanorama(){
  const n=Q().length;
  return cabecaRodada(`${n} ${n===1?'questão':'questões'}. A recomendada de cada uma já vem marcada: troque só o que discordar.`)
   + `<div class="caixa"><div class="cols" aria-hidden="true"><span class="c-tema">Tema</span><span class="c-perg">Pergunta</span><span class="c-resp">Resposta</span><span class="c-nota">Nota</span></div>
   ${Q().map((q,i)=>{ const a=resp(q); return `<div class="lin ${marca(q)==='outra'?'troca':''}" data-lin="${i}">
     <div class="c-tema"><div class="qid">${esc(q.id)}</div><div class="cab">${esc(q.cabecalho)}</div><div class="st" data-marca="${i}">${statusHTML(q)}</div></div>
     <div class="c-perg"><div class="tit">${md(q.titulo)}</div>${q.contexto?`<div class="ctx">${md(q.contexto)}</div>`:''}</div>
     <div class="c-resp"><div class="pills">${pills(q,i)}</div><div class="desc" data-desc="${i}">${descHTML(q)}</div>${campoProp(q,i)}${campoCom(q,i)}</div>
     <div class="c-nota">${somBtn(i)}<button class="ico ${a.com.trim()?'tem':''}" data-com="${i}" aria-label="Nota sobre esta questão" title="Nota para o agente" onclick="abrir(${i},'abreCom')">${ICONE_NOTA}</button></div>
   </div>`; }).join('')}</div>
   <p class="nota-rodape">Clique numa opção para trocar a resposta; passe o mouse para ver a descrição. ★ marca a recomendada do agente. Escrever no terminal também assume o grill por lá.</p>` + historico();
}
// a lista lateral de Uma por vez muda com a marca; atualiza() a redesenha sem render()
const escolhaTexto = q => { const a=resp(q); return a.opcao!==null ? puro(q.opcoes[a.opcao].rotulo) : (a.propria.trim()||'—'); };
function ladoHTML(q,i){
  const m=marca(q);
  return `<span class="bola ${m||''}">${m?(m==='aceito'?'✓':'⇄'):i+1}</span>
    <span style="min-width:0"><b style="font-weight:600">${esc(q.cabecalho)}</b><small>${esc(escolhaTexto(q))}${resp(q).com.trim()?' · nota':''}</small></span>`;
}
function modoFoco(){ // uma questão por vez, lista lateral, teclas 1–9 e Enter
  const ps=Q(), q=ps[S.foco], i=S.foco, a=resp(q);
  return cabecaRodada(`Uma questão por vez, com a descrição de cada opção. Teclas 1–${Math.min(9,Math.max(...ps.map(p=>p.opcoes.length)))} escolhem, Enter avança.`)
   + `<div class="foco">
   <nav class="caixa lado" aria-label="Questões da rodada">${ps.map((p,k)=>`<button class="${k===i?'on':''}" data-lado="${k}" onclick="S.foco=${k};render()">${ladoHTML(p,k)}</button>`).join('')}</nav>
   <section class="caixa cartao">
    <div class="row" style="display:flex;align-items:center;gap:10px"><span class="qid">${esc(q.id)} · ${esc(q.cabecalho)}</span><span class="st" data-marca="${i}">${statusHTML(q)}</span>
      <span class="muted" style="margin-left:auto;font-size:13px">${i+1} de ${ps.length}</span>${somBtn(i)}</div>
    <h2>${md(q.titulo)}</h2>${q.contexto?`<div class="ctx" style="font-size:14px">${md(q.contexto)}</div>`:''}
    <div class="opts">${q.opcoes.map((o,j)=>`<button class="opt ${o.recomendada?'rec':''} ${a.opcao===j?'sel':''}" data-q="${i}" data-o="${j}" aria-pressed="${a.opcao===j}" onclick="escolher(${i},${j})">
      <span class="kbd">${j+1}</span><span><span class="lab">${md(o.rotulo)}</span>${o.recomendada?`<span class="estrela">${ESTRELA} recomendada</span>`:''}${o.descricao?`<span class="d">${md(o.descricao)}</span>`:''}</span></button>`).join('')}</div>
    <label class="rotulo" for="prop-${i}">Ou escreva a sua resposta</label>
    <input id="prop-${i}" class="campo" style="margin-top:6px" value="${esc(a.propria)}" oninput="propria(${i},this.value)">
    <label class="rotulo" for="com-${i}">Nota para o agente</label>
    <input id="com-${i}" class="campo nota" style="margin-top:6px" value="${esc(a.com)}" oninput="comentar(${i},this.value)">
    <div class="navega"><button class="btn sec" ${i?'':'disabled'} onclick="S.foco--;render()">← Anterior</button>
     ${i<ps.length-1?`<button class="btn pri" onclick="S.foco++;render()">Próxima →</button>`:'<span></span>'}</div>
   </section></div>` + historico();
}

// ---------- telas do fluxo ----------
function topo(){
  const feitas = E.historico.length, fim = ['final','concluido'].includes(E.fase);
  const passos = [];
  if(feitas>2) passos.push(`<li class="feito">Rodadas 1–${feitas} ✓</li>`);
  else for(let k=1;k<=feitas;k++) passos.push(`<li class="feito">Rodada ${k} ✓</li>`);
  if(E.fase==='rodada') passos.push(`<li class="agora">Rodada ${R().rodada}</li>`);
  passos.push(`<li class="${fim?'agora':''}">Fechamento${E.fase==='concluido'?' ✓':''}</li>`);
  const ativo = !['concluido','cli'].includes(E.fase) && !S.caiu;
  return `<header class="top"><div class="top-in"><span class="marca">grill</span><span class="muted">${esc(E.projeto)}</span>
   <ol class="passos">${passos.join('<li class="traco" aria-hidden="true"></li>')}</ol>
   <div class="acoes">
   ${E.fase==='rodada'?`<div class="seg" role="group" aria-label="Modo">${Object.entries(VAR).map(([k,n])=>`<button class="${k===V?'on':''}" aria-pressed="${k===V}" onclick="modo('${k}')">${n}</button>`).join('')}</div>`:''}
   <button class="ico" aria-label="Leitura em voz alta" title="Leitura em voz alta" popovertarget="cfg-leitura">${ICONE_SOM}</button>
   <button class="ico" aria-label="Alternar tema" title="Alternar tema" onclick="tema()">${escuro()?ICONE_SOL:ICONE_LUA}</button>
   ${ativo?`<button class="sublink" onclick="paraCli()">Seguir no terminal</button>`:''}</div></div></header>` + painelVoz();
}
const telaRodada = () => (V==='B' ? modoFoco : modoPanorama)();
function telaAguarde(){
  const inicio = E.fase==='inicio';
  return `<div class="centro"><div><div class="spin"></div>
    <h1 class="h1">${inicio?'O agente está preparando a primeira rodada…':'O agente está lendo as suas respostas…'}</h1>
    <p class="sub">${inicio?'':'Ele decide se há mais perguntas ou se o grill fechou.<br>'}O terminal continua livre: escrever lá assume o grill no CLI.</p>
    ${E.ultima?`<details class="recebido"><summary>O que o agente recebeu</summary><pre>${esc(JSON.stringify(E.ultima,null,2))}</pre></details>`:''}</div></div>`;
}
function telaFinal(){
  const n=E.final.tabela.length, r=E.historico.length;
  return `<div class="final"><h1 class="h1">O entendimento, fechado</h1>
   <p class="sub" style="margin-bottom:20px">${n} ${n===1?'decisão':'decisões'}${r?` em ${r} ${r===1?'rodada':'rodadas'}`:''}. Confirme, ou diga o que mudar e o agente reabre uma rodada só com isso.</p>
   <div class="caixa" style="overflow-x:auto"><table><tr><th style="width:56px">#</th><th style="width:200px">Decisão</th><th>Escolha</th></tr>
   ${E.final.tabela.map((l,i)=>`<tr><td class="mono muted">${i+1}</td><td style="font-weight:600">${md(l.decisao)}</td><td>${md(l.escolha)}</td></tr>`).join('')}</table></div>
   <div style="margin-top:20px">${S.abreAjuste
     ? `<label class="rotulo" for="ajuste" style="margin-top:0">O que precisa mudar?</label>
        <textarea id="ajuste" rows="3" style="margin-top:6px" oninput="S.ajuste=this.value">${esc(S.ajuste)}</textarea>
        <div class="envio" style="margin-top:10px"><button class="btn pri" onclick="ajustar()">Enviar ajuste</button>
        <button class="btn sec" onclick="S.abreAjuste=false;render()">Cancelar</button>${S.erro?`<span class="erro">${esc(S.erro)}</span>`:''}</div>`
     : `<div class="envio"><button class="btn ok" onclick="confirmar()">Confirmo o entendimento</button>
        <button class="btn sec" onclick="S.abreAjuste=true;render();document.getElementById('ajuste').focus()">Quero ajustar</button>
        <span class="muted" style="font-size:12.5px">O sim volta ao terminal e a página fecha sozinha.</span></div>`}</div></div>`;
}
const telaFim = (glifo,t,s) => `<div class="centro"><div><div class="glifo">${glifo}</div><h1 class="h1">${t}</h1><p class="sub">${s}</p></div></div>`;

async function confirmar(){ await api('respostas','POST',{tipo:'sim'}); await consultar(true); }
async function ajustar(){
  const r = await api('respostas','POST',{tipo:'ajuste', texto:S.ajuste});
  if(r.ok){ S.abreAjuste=false; S.ajuste=''; S.erro=''; } else S.erro = r.json && r.json.erro || 'o servidor recusou o ajuste';
  await consultar(true);
}
async function paraCli(){ await api('cli','POST',{}); await consultar(true); }

function render(){
  if(!E){ document.getElementById('app').innerHTML = telaFim('…','Conectando…',''); return; }
  const corpo = S.caiu ? telaFim('!','O servidor do grill parou','Volte ao terminal: o grill segue lá. Pode fechar esta aba.')
    : { inicio:telaAguarde, rodada:telaRodada, aguarde:telaAguarde, final:telaFinal,
    concluido:()=>telaFim('✓','Grill concluído','Volte ao terminal: o agente já tem o seu sim. Pode fechar esta aba.'),
    cli:()=>telaFim('&gt;_','O grill segue no terminal','O agente parou de esperar a tela e faz a próxima rodada no CLI. Pode fechar esta aba.') }[E.fase]();
  document.getElementById('app').innerHTML = topo() + `<main class="wrap">${corpo}</main>`;
}
function atualiza(i){ // resumo, marca, linha, opções e lateral, sem render(), para não roubar o foco do campo de texto
  if(E.fase!=='rodada') return;
  const t=Q().length, n=nProntas(), q=qi(i), a=resp(q), m=marca(q);
  const r=document.getElementById('resumo'); if(r) r.textContent=resumoTexto();
  const b=document.getElementById('enviar'); if(b) b.disabled=n<t;
  const troca = (sel, html) => document.querySelectorAll(sel).forEach(el=>el.innerHTML=html);
  troca(`[data-marca="${i}"]`, statusHTML(q));
  troca(`[data-desc="${i}"]`, descHTML(q));
  troca(`[data-lado="${i}"]`, ladoHTML(q,i));
  document.querySelectorAll(`[data-lin="${i}"]`).forEach(el=>el.classList.toggle('troca', m==='outra'));
  document.querySelectorAll(`[data-com="${i}"]`).forEach(el=>el.classList.toggle('tem', !!a.com.trim()));
  document.querySelectorAll(`[data-q="${i}"]`).forEach(el=>{
    const on = el.dataset.o==='outra' ? a.opcao===null : a.opcao===+el.dataset.o;
    el.classList.toggle('sel', on); el.setAttribute('aria-pressed', on);
  });
}

// ---------- consulta ao servidor ----------
async function consultar(forcar){
  if(S.caiu || (E && ['concluido','cli'].includes(E.fase))) return;
  try{
    const r = await api('estado');
    const mudou = !E || r.json.versao !== E.versao;
    E = r.json;
    if(mudou){ S.foco=0; parar(); }
    if(mudou || forcar){ render(); if(mudou) scrollTo(0,0); }
  }catch(e){ if(E){ S.caiu=true; render(); } }
}
addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select') || !E || E.fase!=='rodada' || V!=='B') return;
  const q = Q()[S.foco];
  if(/^[1-9]$/.test(e.key) && q.opcoes[+e.key-1]) escolher(S.foco,+e.key-1);
  else if(e.key==='Enter' && !e.target.closest('button') && S.foco<Q().length-1){ S.foco++; render(); }
});
api('preferencias').then(r=>{
  const p = r.json || {};
  if(VAR[p.modo]) V=p.modo;
  if(p.tema==='light'||p.tema==='dark') document.documentElement.dataset.theme=p.tema;
  if(typeof p.voz==='string') LEIT.voz=p.voz;
  if([0.5,0.75,1,1.25,1.5,1.75,2].includes(p.velocidade)) LEIT.vel=p.velocidade;
  if(typeof p.volume==='number' && p.volume>=0 && p.volume<=1) LEIT.vol=p.volume;
}).catch(()=>{}).finally(()=>{ render(); consultar(); });
setInterval(consultar, 1000);
</script>
</body>
</html>
